version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Compatibility hold (2026-09-28): @cloudflare/vitest-plugin 1.3.0
      # still requires Vitest ^4.1.0. Re-evaluate when the official plugin
      # peerDependencies support Vitest 5. Security updates are unaffected.
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
    groups:
      worker-tests:
        patterns:
          - vitest
          - "@cloudflare/vitest-plugin"
      npm-minor-and-patch:
        exclude-patterns:
          - "@types/vscode"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 10
