name: Publish VS Code Extension

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vX.Y.Z tag to recover without recreating it
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: Reuse verified CI artifact
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  github-release:
    name: Publish GitHub Release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      ARTIFACT_NAME: ${{ needs.quality.outputs['artifact-name'] }}
      VSIX_NAME: ${{ needs.quality.outputs['vsix-name'] }}
      CHECKSUM_NAME: ${{ needs.quality.outputs['checksum-name'] }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifacts

      - name: Publish release with VSIX and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release-artifacts/$VSIX_NAME" \
              "release-artifacts/$CHECKSUM_NAME" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Singular Blockly $RELEASE_TAG" \
              --notes-file release-artifacts/release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "release-artifacts/$VSIX_NAME" \
              "release-artifacts/$CHECKSUM_NAME" \
              --verify-tag \
              --title "Singular Blockly $RELEASE_TAG" \
              --notes-file release-artifacts/release-notes.md \
              --latest
          fi

  publish-marketplace:
    name: Publish VS Code Marketplace
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ${{ needs.quality.outputs['artifact-name'] }}
      VSIX_NAME: ${{ needs.quality.outputs['vsix-name'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install pinned publishing tools
        run: npm ci

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifacts

      - name: Publish the shared VSIX
        if: github.run_attempt == 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm exec -- vsce publish --packagePath "release-artifacts/$VSIX_NAME"

      - name: Retry an ambiguously completed Marketplace publish
        if: github.run_attempt > 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm exec -- vsce publish --packagePath "release-artifacts/$VSIX_NAME" --skip-duplicate

  publish-open-vsx:
    name: Publish Open VSX
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ${{ needs.quality.outputs['artifact-name'] }}
      VSIX_NAME: ${{ needs.quality.outputs['vsix-name'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install pinned publishing tools
        run: npm ci

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifacts

      - name: Publish the shared VSIX
        if: github.run_attempt == 1
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm exec -- ovsx publish "release-artifacts/$VSIX_NAME"

      - name: Retry an ambiguously completed Open VSX publish
        if: github.run_attempt > 1
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm exec -- ovsx publish "release-artifacts/$VSIX_NAME" --skip-duplicate

  verify:
    name: Verify all release destinations
    if: always()
    needs:
      - quality
      - github-release
      - publish-marketplace
      - publish-open-vsx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ${{ needs.quality.outputs['artifact-name'] }}
      VSIX_NAME: ${{ needs.quality.outputs['vsix-name'] }}
      CHECKSUM_NAME: ${{ needs.quality.outputs['checksum-name'] }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
      MARKETPLACE_RESULT: ${{ needs.publish-marketplace.result }}
      OPEN_VSX_RESULT: ${{ needs.publish-open-vsx.result }}
    steps:
      - name: Confirm publishing jobs succeeded
        run: |
          test "$GITHUB_RELEASE_RESULT" = success
          test "$MARKETPLACE_RESULT" = success
          test "$OPEN_VSX_RESULT" = success

      - name: Download shared artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifacts

      - name: Verify checksum and GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-artifacts
          sha256sum --check "$CHECKSUM_NAME"
          cd ..
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > release-assets.txt
          grep -Fx "$VSIX_NAME" release-assets.txt
          grep -Fx "$CHECKSUM_NAME" release-assets.txt
