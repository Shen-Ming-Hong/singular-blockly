name: Publish VS Code Extension

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: |
          npm install -g @vscode/vsce
          vsce package --out singular-blockly.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: singular-blockly-vsix
          path: singular-blockly.vsix
          if-no-files-found: error

  publish-marketplace:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: singular-blockly-vsix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish to VS Code Marketplace
        # VSCE_PAT 為 Azure DevOps Personal Access Token
        # 若發布失敗並出現 "Access Denied / expired PAT"，請至以下網址更新：
        # 1. 建立新 PAT：https://dev.azure.com/SingularMaker/_usersSettings/tokens
        #    - Organization: All accessible organizations
        #    - Scopes: Marketplace > Manage
        # 2. 更新 GitHub Secret：https://github.com/Shen-Ming-Hong/singular-blockly/settings/secrets/actions
        #    找 VSCE_PAT > Update secret
        run: |
          npm install -g @vscode/vsce
          vsce publish --packagePath singular-blockly.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-open-vsx:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: singular-blockly-vsix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish to Open VSX Registry
        # OVSX_PAT 為 Open VSX Access Token
        # 若發布失敗或 Token 過期，請至以下網址更新：
        # 1. 建立新 Token：https://open-vsx.org/user-settings/tokens
        # 2. 更新 GitHub Secret：https://github.com/Shen-Ming-Hong/singular-blockly/settings/secrets/actions
        #    找 OVSX_PAT > Update secret
        run: |
          npm install -g ovsx
          ovsx publish singular-blockly.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
