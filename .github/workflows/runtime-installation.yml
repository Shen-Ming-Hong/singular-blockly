name: Managed Runtime Installation

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Require the declared ARM64 release matrix
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      candidate_ref:
        description: Immutable release ref selected by the caller
        required: false
        type: string
      release_candidate:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: runtime-installation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare bound candidate
    if: >-
      inputs.release_candidate == true ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'runtime-e2e-approved') ||
      contains(github.event.pull_request.labels.*.name, 'release-candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head-sha: ${{ steps.identity.outputs.head-sha }}
      tree-sha: ${{ steps.identity.outputs.tree-sha }}
      vsix-sha256: ${{ steps.identity.outputs.vsix-sha256 }}
      manifest-sha256: ${{ steps.identity.outputs.manifest-sha256 }}
      release-mode: ${{ steps.identity.outputs.release-mode }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Install dependencies and package one shared VSIX
        run: |
          npm ci
          mkdir -p runtime-candidate
          npm exec -- vsce package --out runtime-candidate/runtime-candidate.vsix

      - name: Record candidate identities
        id: identity
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release_candidate }}
          RELEASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release-candidate') }}
        run: |
          echo "head-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree-sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "vsix-sha256=$(sha256sum runtime-candidate/runtime-candidate.vsix | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest-sha256=$(sha256sum resources/managed-runtime/runtime-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_INPUT" == "true" || "$RELEASE_LABEL" == "true" ]]; then
            echo "release-mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "release-mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload bound candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-runtime-candidate
          path: runtime-candidate/runtime-candidate.vsix
          if-no-files-found: error
          retention-days: 14

  x64:
    name: Real install (${{ matrix.platform }}/x64)
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            artifact: linux-x64
          - runner: windows-2025
            platform: win32
            artifact: windows-x64
          - runner: macos-15-intel
            platform: darwin
            artifact: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Download bound candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate
          path: runtime-candidate

      - name: Perform real install and offline restart
        shell: bash
        run: |
          npm ci
          npm run test:managed-runtime:e2e -- --allow-network --root "$RUNNER_TEMP" --result runtime-result.json

      - name: Collect privacy-safe evidence
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          TREE_SHA: ${{ needs.prepare.outputs.tree-sha }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          node scripts/managed-runtime/collect-evidence.js \
            --output "evidence-${{ matrix.artifact }}.json" \
            --repository "$REPOSITORY" --pull-request-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --tree-sha "$TREE_SHA" \
            --vsix runtime-candidate/runtime-candidate.vsix \
            --manifest resources/managed-runtime/runtime-manifest.json \
            --os "${{ matrix.platform }}" --arch x64 --runner "${{ matrix.runner }}" \
            --runtime-result runtime-result.json \
            --event-name "$EVENT_NAME" --is-fork "$IS_FORK"

      - name: Upload matrix evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-${{ matrix.artifact }}
          path: evidence-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 14

  arm64:
    name: Release install (${{ matrix.platform }}/arm64)
    if: needs.prepare.outputs.release-mode == 'release'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            platform: linux
            artifact: linux-arm64
          - runner: windows-11-arm
            platform: win32
            artifact: windows-arm64
          - runner: macos-15
            platform: darwin
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - name: Download bound candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-runtime-candidate
          path: runtime-candidate

      - name: Perform release-candidate install and offline restart
        shell: bash
        run: |
          npm ci
          npm run test:managed-runtime:e2e -- --allow-network --allow-release-candidate --root "$RUNNER_TEMP" --result runtime-result.json

      - name: Collect privacy-safe evidence
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          TREE_SHA: ${{ needs.prepare.outputs.tree-sha }}
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
        run: |
          node scripts/managed-runtime/collect-evidence.js \
            --output "evidence-${{ matrix.artifact }}.json" \
            --repository "$REPOSITORY" --pull-request-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --tree-sha "$TREE_SHA" \
            --vsix runtime-candidate/runtime-candidate.vsix \
            --manifest resources/managed-runtime/runtime-manifest.json \
            --os "${{ matrix.platform }}" --arch arm64 --runner "${{ matrix.runner }}" \
            --runtime-result runtime-result.json \
            --event-name "$EVENT_NAME" --is-fork "$IS_FORK"

      - name: Upload matrix evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-${{ matrix.artifact }}
          path: evidence-${{ matrix.artifact }}.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Managed runtime evidence gate
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, x64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm required matrix jobs passed
        env:
          X64_RESULT: ${{ needs.x64.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
          RELEASE_MODE: ${{ needs.prepare.outputs.release-mode }}
        run: |
          test "$X64_RESULT" = success
          if [[ "$RELEASE_MODE" == release ]]; then test "$ARM64_RESULT" = success; fi

      - name: Checkout evidence verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}

      - name: Download evidence files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-evidence-*
          path: runtime-evidence
          merge-multiple: true

      - name: Verify candidate identity and matrix completeness
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.release-mode }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          TREE_SHA: ${{ needs.prepare.outputs.tree-sha }}
          VSIX_SHA256: ${{ needs.prepare.outputs.vsix-sha256 }}
          MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mapfile -t files < <(find runtime-evidence -type f -name 'evidence-*.json' -print | sort)
          args=()
          for file in "${files[@]}"; do args+=(--evidence "$file"); done
          node scripts/managed-runtime/verify-evidence.js \
            --mode "$RELEASE_MODE" --repository "$REPOSITORY" \
            --head-sha "$HEAD_SHA" --tree-sha "$TREE_SHA" \
            --vsix-sha256 "$VSIX_SHA256" --manifest-sha256 "$MANIFEST_SHA256" \
            --pull-request-number "$PR_NUMBER" --event-name "$EVENT_NAME" \
            --manifest resources/managed-runtime/runtime-manifest.json "${args[@]}"
