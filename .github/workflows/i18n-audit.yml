name: Monthly Translation Audit

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit all non-English locales
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure audit report paths
        shell: bash
        run: |
          echo "AUDIT_REPORT=$RUNNER_TEMP/translation-audit.json" >> "$GITHUB_ENV"
          echo "AUDIT_SUMMARY=$RUNNER_TEMP/translation-audit-summary.txt" >> "$GITHUB_ENV"
          echo "PATTERN_REPORT=$RUNNER_TEMP/translation-patterns.txt" >> "$GITHUB_ENV"

      - name: Detect translation patterns
        run: node scripts/i18n/detect-patterns.js --all > "$PATTERN_REPORT"

      - name: Run full translation audit
        run: >-
          node scripts/i18n/audit-translations.js
          --languages=ja,ko,de,zh-hant,es,fr,it,pl,pt-br,ru,tr,cs,hu,bg
          --output "$AUDIT_REPORT"

      - name: Generate text and Actions summaries
        shell: bash
        run: |
          node scripts/i18n/audit-summary.js "$AUDIT_REPORT" > "$AUDIT_SUMMARY"
          cat "$AUDIT_SUMMARY"
          {
            echo "## Translation quality audit"
            echo
            echo '```text'
            cat "$AUDIT_SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete audit reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translation-audit-${{ github.run_id }}
          path: |
            ${{ env.AUDIT_REPORT }}
            ${{ env.AUDIT_SUMMARY }}
            ${{ env.PATTERN_REPORT }}
          if-no-files-found: error
          retention-days: 90

      - name: Update the singleton tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const title = '[i18n] Translation Quality Audit';
            const report = JSON.parse(fs.readFileSync(process.env.AUDIT_REPORT, 'utf8'));
            const summary = fs.readFileSync(process.env.AUDIT_SUMMARY, 'utf8');
            const highSeverity = report.issuesBySeverity.high;
            const body = [
              '## 每月翻譯品質稽核 / Monthly Translation Quality Audit',
              '',
              `高嚴重度問題 / High severity: **${highSeverity}** (門檻 / threshold: 10)`,
              `全部問題 / Total issues: **${report.totalIssues}**`,
              '',
              `[查看本次 Actions 報告與 artifacts / View this run](${process.env.RUN_URL})`,
              '',
              '<details><summary>文字摘要 / Text summary</summary>',
              '',
              '```text',
              summary,
              '```',
              '</details>',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const tracker = issues.find(issue => !issue.pull_request && issue.title === title);

            if (highSeverity > 10) {
              if (tracker) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: tracker.number,
                  state: 'open',
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (tracker?.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracker.number,
                state: 'closed',
                body: `${body}\n\n✅ 已回到門檻內，追蹤 issue 自動關閉。`,
              });
            }
